        let micRecorder = null;
        let micChunks = [];
        DOM.btnMicRec.addEventListener('mousedown', startMicRecord);
        DOM.btnMicRec.addEventListener('touchstart', (e) => { e.preventDefault(); startMicRecord(); });
        window.addEventListener('mouseup', stopMicRecord);
        window.addEventListener('touchend', stopMicRecord);

        async function startMicRecord() {
            if (micRecorder && micRecorder.state === 'recording') return;
            initAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micRecorder = new MediaRecorder(stream);
                micChunks = [];
                micRecorder.ondataavailable = e => micChunks.push(e.data);
                micRecorder.onstop = async () => {
                    const blob = new Blob(micChunks, { 'type' : 'audio/webm; codecs=opus' });
                    const arrayBuffer = await blob.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    padsData[currentEditPadId].originalBuffer = audioBuffer;
                    padsData[currentEditPadId].buffer = audioBuffer;
                    padsData[currentEditPadId].reverse = false;
                    padsData[currentEditPadId].trimStart = 0;
                    padsData[currentEditPadId].trimEnd = 1;
                    updateEditUI();
                    drawWaveform(audioBuffer);
                    stream.getTracks().forEach(t => t.stop());
                };
                micRecorder.start();
                DOM.btnMicRec.classList.add('recording');
                DOM.btnMicRec.classList.remove('text-neon-orange');
            } catch (err) {
                console.error('Mic access denied:', err);
            }
        }

        function stopMicRecord() {
            if (micRecorder && micRecorder.state === 'recording') {
                micRecorder.stop();
                // 약 550행
                DOM.btnMicRec.classList.remove('recording');
                DOM.btnMicRec.classList.add('text-neon-orange');
            }
        }

        function playMetronomeTick() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = (metroBeat === 0) ? 1200 : 800; // 첫 박은 약간 명확한 톤으로 구분
            osc.connect(gain); gain.connect(masterGain);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);

            // 점 4개 순차 점등 제어 (0, 1, 2, 3 순환)
            const dots = DOM.btnMetronome.querySelectorAll('.metro-dot');
            dots.forEach((dot, idx) => {
                if (idx === metroBeat) {
                    dot.style.backgroundColor = '#FF5500';
                } else {
                    dot.style.backgroundColor = '#e0e0e0';
                }
            });

            metroBeat = (metroBeat + 1) % 4;
        }

        DOM.btnMetronome.addEventListener('click', () => {
            isMetronomeOn = !isMetronomeOn;
            if (isMetronomeOn) {
                initAudio();
                metroBeat = 0;
                const bpm = parseInt(DOM.bpmInput.value) || 120;
                metronomeInterval = setInterval(playMetronomeTick, (60 / bpm) * 1000);
                playMetronomeTick();
            } else {
                clearInterval(metronomeInterval);
                metroBeat = 0;
                const dots = DOM.btnMetronome.querySelectorAll('.metro-dot');
                dots.forEach(dot => dot.style.backgroundColor = '#e0e0e0');
            }
        });

        DOM.bpmInput.addEventListener('change', () => {
            if(isMetronomeOn) {
                clearInterval(metronomeInterval);
                const bpm = parseInt(DOM.bpmInput.value) || 120;
                metronomeInterval = setInterval(playMetronomeTick, (60 / bpm) * 1000);
            }
        });

        DOM.btnRecPerf.addEventListener('click', () => {
            if (!isRecordingPerf) {
                initAudio();
                recordedChunks = [];
                performanceWavBlob = null;
                const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                mediaRecorder = new MediaRecorder(destNode.stream, { mimeType });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    performanceBlob = new Blob(recordedChunks, { type: mimeType });

                    if (performanceAudioUrl) URL.revokeObjectURL(performanceAudioUrl);
                    performanceAudioUrl = URL.createObjectURL(performanceBlob);
                    performanceAudio = new Audio(performanceAudioUrl);

                    try {
                        performanceWavBlob = await encodeWav(performanceBlob);
                        DOM.btnExport.classList.remove('opacity-50', 'pointer-events-none');
                    } catch (err) {
                        console.error('WAV conversion failed:', err);
                        performanceWavBlob = null;
                        alert('WAV 변환에 실패했습니다.');
                    }
                };
                mediaRecorder.start();
                isRecordingPerf = true;
                DOM.btnRecPerf.classList.add('recording');
                DOM.btnRecPerf.classList.remove('text-neon-orange');
            } else {
                mediaRecorder.stop();
                isRecordingPerf = false;
                DOM.btnRecPerf.classList.remove('recording');
                DOM.btnRecPerf.classList.add('text-neon-orange');
            }
        });

        DOM.btnPlayPerf.addEventListener('click', () => {
            if(performanceAudio) {
                if(performanceAudio.paused) {
                    performanceAudio.play();
                    DOM.btnPlayPerf.classList.add('bg-neon-green', 'text-matte-bg');
                    DOM.btnPlayPerf.classList.remove('text-neon-green');
                    performanceAudio.onended = () => {
                        DOM.btnPlayPerf.classList.remove('bg-neon-green', 'text-matte-bg');
                        DOM.btnPlayPerf.classList.add('text-neon-green');
                    };
                } else {
                    performanceAudio.pause();
                    performanceAudio.currentTime = 0;
                    DOM.btnPlayPerf.classList.remove('bg-neon-green', 'text-matte-bg');
                    DOM.btnPlayPerf.classList.add('text-neon-green');
                }
            }
        });

        async function encodeWav(blob) {
            const arrayBuffer = await blob.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const numChannels = Math.min(audioBuffer.numberOfChannels, 2);
            const sampleRate = audioBuffer.sampleRate;
            const numSamples = audioBuffer.length;

            const bytesPerSample = 2; // 16-bit PCM
            const blockAlign = numChannels * bytesPerSample;
            const dataSize = numSamples * blockAlign;

            const wavBuffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(wavBuffer);

            function writeString(offset, str) {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(offset + i, str.charCodeAt(i));
                }
            }

            // RIFF header
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');

            // fmt chunk
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true); // PCM chunk size
            view.setUint16(20, 1, true);  // PCM format
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); // 16-bit

            // data chunk
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            const channels = [];

            for (let channel = 0; channel < numChannels; channel++) {
                channels.push(audioBuffer.getChannelData(channel));
            }

            let offset = 44;

            for (let i = 0; i < numSamples; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    const sample = Math.max(
                        -1,
                        Math.min(1, channels[channel][i])
                    );

                    const intSample = sample < 0
                        ? sample * 0x8000
                        : sample * 0x7FFF;

                    view.setInt16(offset, intSample, true);
                    offset += 2;
                }
            }

            return new Blob([wavBuffer], {
                type: 'audio/wav'
            });
        }

        DOM.btnExport.addEventListener('click', () => {
            if (!performanceWavBlob) return;

            let fileName = prompt(
                'Save as...',
                'swiftsketch_beat'
            );

            if (!fileName) return;

            fileName = fileName
                .replace(/[\\/:*?"<>|]/g, '')
                .trim();

            if (!fileName) {
                fileName = 'swiftsketch_beat';
            }

            if (!fileName.toLowerCase().endsWith('.wav')) {
                fileName += '.wav';
            }

            const wavUrl = URL.createObjectURL(performanceWavBlob);

            const a = document.createElement('a');
            a.href = wavUrl;
            a.download = fileName;

            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                URL.revokeObjectURL(wavUrl);
            }, 1000);
        });

        createPadElements();
        document.body.addEventListener('touchstart', initAudio, { once: true });
        document.body.addEventListener('mousedown', initAudio, { once: true });

        // === [추가] 신스 코드 연주 엔진 (동시 터치 AND 로직) ===
        
        // 파형 변경 버튼
        DOM.btnWaveSelect.addEventListener('click', () => {
            currentWaveIndex = (currentWaveIndex + 1) % waveTypes.length;
            drawSynthWaveform();
        });

        // === [추가] 신스 파형 드로잉 함수 ===
        function drawSynthWaveform() {
            if (!isResizing) resizeCanvasInternal();
            const dpr = window.devicePixelRatio || 1;
            const width = DOM.canvas.width / dpr;
            const height = DOM.canvas.height / dpr;
            
            canvasCtx.fillStyle = '#1a1a1a';
            canvasCtx.fillRect(0, 0, width, height);
            
            canvasCtx.strokeStyle = '#00E5FF';
            canvasCtx.lineWidth = 2.5;
            canvasCtx.beginPath();
            
            const type = waveTypes[currentWaveIndex];
            const periods = 3; // 화면에 그릴 파형의 주기 수
            
            for(let x = 0; x < width; x++) {
                let y = height / 2;
                const phase = (x / width) * Math.PI * 2 * periods;
                
                if(type === 'sine') y += Math.sin(phase) * (height / 3);
                else if(type === 'square') y += (Math.sin(phase) > 0 ? 1 : -1) * (height / 3);
                else if(type === 'sawtooth') y += (((phase % (Math.PI * 2)) / (Math.PI)) - 1) * (height / 3);
                else if(type === 'triangle') y += (Math.abs(((phase % (Math.PI * 2)) / Math.PI) - 1) * 2 - 1) * (height / 3);
                
                if(x === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
            }
            canvasCtx.stroke();

            // 파형 버튼 내부의 아이콘(SVG) 및 텍스트 3글자 약자 변경
            const waveIcon = document.getElementById('wave-icon');
            const waveName = document.getElementById('wave-name-display'); // 텍스트 엘리먼트 가져오기
            
            if (waveIcon && waveName) {
                if (type === 'sine') {
                    waveIcon.innerHTML = '<path d="M2 12 Q 7 2 12 12 T 22 12"></path>';
                    waveName.innerText = 'SIN';
                }
                else if (type === 'square') {
                    waveIcon.innerHTML = '<path d="M2 12 L 2 6 L 12 6 L 12 18 L 22 18 L 22 12"></path>';
                    waveName.innerText = 'SQR';
                }
                else if (type === 'sawtooth') {
                    waveIcon.innerHTML = '<path d="M2 18 L 12 6 L 12 18 L 22 6 L 22 18"></path>';
                    waveName.innerText = 'SAW';
                }
                else if (type === 'triangle') {
                    waveIcon.innerHTML = '<path d="M2 12 L 7 4 L 17 20 L 22 12"></path>';
                    waveName.innerText = 'TRI';
                }
            }
        }

        // 모드 전환 시 눌림 상태 초기화
        function resetSynthVisuals() {
            if(currentPressedRootBtn) currentPressedRootBtn.classList.remove('chord-active-root');
            if(currentPressedTypeBtn) currentPressedTypeBtn.classList.remove('chord-active-type');
            currentPressedRootBtn = null; currentPressedTypeBtn = null;
            currentPressedRoot = null; currentPressedType = null;
        }

        function checkAndPlaySynth() {
            stopSynthChord(); 
            // 근음과 코드 타입이 둘 다 눌려 있을 때만 재생 (AND 조건)
            if (currentPressedRoot !== null && currentPressedType !== null) {
                playSynthChord(currentPressedRoot, currentPressedType);
            }
        }

        // 근음(Root) 버튼 이벤트 연결
        document.querySelectorAll('.chord-root').forEach(btn => {
            const press = (e) => {
                e.preventDefault(); if (currentPressedRootBtn === btn) return;
                initAudio();
                if (currentPressedRootBtn) currentPressedRootBtn.classList.remove('chord-active-root');
                btn.classList.add('chord-active-root');
                currentPressedRootBtn = btn; currentPressedRoot = parseInt(btn.dataset.root);
                checkAndPlaySynth();
            };
            const release = (e) => {
                e.preventDefault();
                if (currentPressedRootBtn === btn) {
                    btn.classList.remove('chord-active-root');
                    currentPressedRootBtn = null; currentPressedRoot = null;
                    stopSynthChord(); // 하나라도 떼면 즉시 멈춤
                }
            };
            btn.addEventListener('mousedown', press); btn.addEventListener('touchstart', press);
            btn.addEventListener('mouseup', release); btn.addEventListener('touchend', release); btn.addEventListener('mouseleave', release);
        });

        // 코드 종류(Type) 버튼 이벤트 연결
        document.querySelectorAll('.chord-type').forEach(btn => {
            const press = (e) => {
                e.preventDefault(); if (currentPressedTypeBtn === btn) return;
                initAudio();
                if (currentPressedTypeBtn) currentPressedTypeBtn.classList.remove('chord-active-type');
                btn.classList.add('chord-active-type');
                currentPressedTypeBtn = btn; currentPressedType = btn.dataset.type;
                checkAndPlaySynth();
            };
            const release = (e) => {
                e.preventDefault();
                if (currentPressedTypeBtn === btn) {
                    btn.classList.remove('chord-active-type');
                    currentPressedTypeBtn = null; currentPressedType = null;
                    stopSynthChord(); // 하나라도 떼면 즉시 멈춤
                }
            };
            btn.addEventListener('mousedown', press); btn.addEventListener('touchstart', press);
            btn.addEventListener('mouseup', release); btn.addEventListener('touchend', release); btn.addEventListener('mouseleave', release);
        });

        // 🎛 전역 신스 FX 버스 선언
        let fxInitialized = false;
        let synthFXBus, convolver, reverbMix, delayNode, delayFb, delayMix;

        function initSynthFX() {
            if(fxInitialized || !audioCtx) return;
            synthFXBus = audioCtx.createGain();
            
            // Reverb Setting
            convolver = audioCtx.createConvolver();
            reverbMix = audioCtx.createGain();
            reverbMix.gain.value = synthState.reverb.mix;
            updateReverbBuffer();
            synthFXBus.connect(convolver); convolver.connect(reverbMix);
            
            // Delay Setting
            delayNode = audioCtx.createDelay(2.0);
            delayNode.delayTime.value = 0.375; // 점8분음표 느낌
            delayFb = audioCtx.createGain();
            delayFb.gain.value = synthState.delay.fb;
            delayMix = audioCtx.createGain();
            delayMix.gain.value = synthState.delay.mix;
            synthFXBus.connect(delayNode); delayNode.connect(delayFb); delayFb.connect(delayNode); delayNode.connect(delayMix);
            
            // Routing to Master (DRY + WET)
            synthFXBus.connect(masterGain); synthFXBus.connect(recordGain);
            reverbMix.connect(masterGain); reverbMix.connect(recordGain);
            delayMix.connect(masterGain); delayMix.connect(recordGain);
            fxInitialized = true;
        }

        function updateReverbBuffer() {
            if(!audioCtx || !convolver) return;
            const decay = synthState.reverb.decay;
            const rate = audioCtx.sampleRate;
            const len = Math.max(1, rate * decay);
            const imp = audioCtx.createBuffer(2, len, rate);
            for(let c=0; c<2; c++) {
                const data = imp.getChannelData(c);
                for(let i=0; i<len; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
            }
            convolver.buffer = imp;
        }
        
        // 🎹 신스 오디오 엔진 (FX 및 Key/Octave 완벽 연동)
        function playSynthChord(root, type) {
            initSynthFX(); // 연주 시 FX 초기화 확인
            const c4Freq = 261.63; // 기준음 C4
// 선택한 Key + 현재 패드의 scale degree를 실제 코드 근음으로 사용
const rootPitch = synthState.key + root;
const baseFreq = c4Freq * Math.pow(2, rootPitch / 12) * Math.pow(2, synthState.octave - 4);
            
            const intervals = {
                'maj': [0, 4, 7], 'min': [0, 3, 7], 'dom7': [0, 4, 7, 10], 'min7': [0, 3, 7, 10],
                'dim': [0, 3, 6], 'aug': [0, 4, 8], 'sus2': [0, 2, 7], 'sus4': [0, 5, 7]
            }[type];
            const waveType = waveTypes[currentWaveIndex];
            const now = audioCtx.currentTime;

            const synthMasterVol = audioCtx.createGain();
            synthMasterVol.gain.value = synthState.vol;

            const lowEQ = audioCtx.createBiquadFilter(); lowEQ.type = 'lowshelf'; lowEQ.frequency.value = 320; lowEQ.gain.value = synthState.eq.low;
            const midEQ = audioCtx.createBiquadFilter(); midEQ.type = 'peaking'; midEQ.frequency.value = 1000; midEQ.Q.value = 0.5; midEQ.gain.value = synthState.eq.mid;
            const highEQ = audioCtx.createBiquadFilter(); highEQ.type = 'highshelf'; highEQ.frequency.value = 3200; highEQ.gain.value = synthState.eq.high;

            lowEQ.connect(midEQ); midEQ.connect(highEQ); highEQ.connect(synthMasterVol);
            synthMasterVol.connect(synthFXBus); // FX 버스로 전송 (공간계 적용)

            // (노브 값 실시간 업데이트 연동)
            if(reverbMix) reverbMix.gain.value = synthState.reverb.mix;
            if(delayMix) delayMix.gain.value = synthState.delay.mix;
            if(delayFb) delayFb.gain.value = synthState.delay.fb;

            const { a, h, d, s } = synthState.env;

            intervals.forEach(interval => {
                const targetFreq = baseFreq * Math.pow(2, interval / 12);
                for (let i = 0; i < synthState.unison; i++) {
                    const osc = audioCtx.createOscillator(); 
                    const gain = audioCtx.createGain();
                    osc.type = waveType; 
                    osc.frequency.value = targetFreq;
                    if (synthState.unison > 1) {
                        const spread = (i / (synthState.unison - 1)) - 0.5;
                        osc.detune.value = spread * 2 * synthState.detune;
                    }
                    const maxVol = 0.8 / (synthState.unison * intervals.length); 
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(maxVol, now + a); 
                    gain.gain.setValueAtTime(maxVol, now + a + h); 
                    gain.gain.linearRampToValueAtTime(maxVol * s, now + a + h + d);
                    
                    osc.connect(gain); gain.connect(lowEQ);
                    osc.start(); 
                    activeSynthNodes.push({ osc, gain });
                }
            });
        }

        function stopSynthChord() {
            const now = audioCtx.currentTime;
            const r = synthState.env.r; // Release 타임
            
            activeSynthNodes.forEach(node => {
                // 예약된 음량 변화 취소
                node.gain.gain.cancelScheduledValues(now);
                
                // 팝 노이즈 방지 핵심: 현재 볼륨값을 명시적으로 고정하여 값이 0이나 1로 튀는 현상 원천 차단
                node.gain.gain.setValueAtTime(node.gain.gain.value, now);
                
                // Release 타임에 맞춰 부드럽게 페이드아웃 (최소 0.015초 보장하여 딱딱거림 방지)
                node.gain.gain.linearRampToValueAtTime(0, now + Math.max(0.015, r)); 
                
                // 메모리 해제
                setTimeout(() => { 
                    try { node.osc.stop(); node.osc.disconnect(); node.gain.disconnect(); } catch(e){} 
                }, Math.max(0.015, r) * 1000 + 100);
            });
            activeSynthNodes = [];
        }

        // 키보드 키와 패드 ID(0~15) 매핑 테이블
        // 키보드의 물리적 위치(e.code) 기준 패드 매핑 (한글/영문 자판 상태 무관)
        const codeMap = {
            // Row 1 (상단 숫자키)
            'Digit4': 0,  'Digit5': 1,  'Digit6': 2,  'Digit7': 3,
            // Row 2 (R T Y U)
            'KeyR': 4,    'KeyT': 5,    'KeyY': 6,    'KeyU': 7,
            // Row 3 (F G H J)
            'KeyF': 8,    'KeyG': 9,    'KeyH': 10,   'KeyJ': 11,
            // Row 4 (V B N M - 하단)
            'KeyV': 12,   'KeyB': 13,   'KeyN': 14,   'KeyM': 15
        };

        // [추가] 현재 활성화된 모드에 맞는 패드 컨테이너(Grid)를 반환하는 헬퍼 함수
        function getActiveGridForKeyboard() {
            if (currentMode === 'sample') return DOM.padGrid;
            if (currentMode === 'chord') return DOM.chordViewGrid;
            // 추후 새로운 모드(예: drum, synth-lead 등)가 추가되면 여기에 한 줄만 추가하면 됩니다.
            return null; 
        }

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.repeat) return; // 꾹 누르고 있을 때 중복 실행 방지

            const padId = codeMap[e.code];
            if (padId !== undefined) {
                const activeGrid = getActiveGridForKeyboard();
                if (activeGrid) {
                    const padEl = activeGrid.children[padId];
                    if (padEl) {
                        // 실제 마우스/터치로 누른 것과 완벽히 동일한 이벤트를 강제 발생(Dispatch)
                        padEl.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.target.tagName === 'INPUT') return;

            const padId = codeMap[e.code];
            if (padId !== undefined) {
                const activeGrid = getActiveGridForKeyboard();
                if (activeGrid) {
                    const padEl = activeGrid.children[padId];
                    if (padEl) {
                        // 손을 떼었을 때의 이벤트 발생 (안전하게 mouseleave까지 호출)
                        padEl.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
                        padEl.dispatchEvent(new MouseEvent('mouseleave', { bubbles: true }));
                    }
                }
            }
        });

    </script>
