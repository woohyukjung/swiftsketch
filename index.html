<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiftsketch Mobile Sampler</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-variable.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', 'Inter', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        matte: {
                            bg: '#1a1a1a',
                            pad: '#242424',
                            dim: '#888888',
                            text: '#e0e0e0'
                        },
                        neon: {
                            orange: '#FF5500',
                            green: '#39FF14'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling/zooming */
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* Enforce rounded corners and no borders globally for UI elements */
        .sq-element {
            border-radius: 16px !important;
            border: none !important;
            box-shadow: none !important;
            text-shadow: none !important;
            overflow: hidden;
        }

        /* Main Container Constraints */
        /* Main Container Constraints */
        #app-container {
            width: min(95vw, 500px, calc((100dvh - 40px) / 1.65));
            height: 100dvh;
            position: relative;
            box-sizing: border-box;
            
            /* 아이폰 노치 및 하단 바를 침범하지 않도록 기기 안전 영역(Safe Area) 패딩 추가 */
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #main-stage {
            position: relative;
            width: 100%;
            flex: 0 0 auto;
        }

        #bottom-controls {
            position: relative;
            width: 100%;
            margin-bottom: 0; /* 중앙 정렬 및 컨테이너 패딩으로 처리되므로 0으로 초기화 */
            flex: 0 0 auto;
        }

        /* Pad Highlights */ /*ㅋㅋㅋ*/
        /* 수정: 서서히 꺼지도록 transition 추가 */
        /* transition 속성을 !important로 지정하여 클래스가 떨어질 때 0.35초 동안 서서히 꺼지게 처리 */
        .bg-matte-pad { transition: background-color 0.35s ease-out !important, color 0.35s ease-out !important; }
        .active-pad { background-color: #FF5500 !important; color: #1a1a1a !important; transition: none !important; }
        .active-btn { background-color: #FF5500 !important; color: #1a1a1a !important; }
        .recording { background-color: #FF5500 !important; color: #e0e0e0 !important; }
        .edit-select-mode { border: none !important; background-color: rgba(255, 85, 0, 0.35) !important; }
        /* 샘플(buffer)이 없는 빈 패드를 위한 어두운 스타일 */
        .edit-select-dim { border: none !important; background-color: rgba(255, 85, 0, 0.1) !important; opacity: 0.4; }

        /* Vertical Range Slider Styling */
        input[type=range].v-slider {
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
            margin: 0;
        }
        
        /* Custom horizontal slider for trim (if needed) or keeping it native for simplicity */
        
        /* Hide elements dynamically */
        .hidden-view { display: none !important; }

        /* Typography sizing for smaller buttons */
        .text-xxs { font-size: 0.65rem; }

        /* Chrome, Safari, Edge, Opera 브라우저의 number input 스피너 제거 및 높이 초기화 */

        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Input 내부 텍스트 수직 중앙 정렬 강제 */
        #bpm-input {
            height: 1em;
            line-height: 1;
            padding: 0;
            margin: 0;
            vertical-align: baseline;
        }

        /* AHDSR Custom Range Sliders */
        .h-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
        }
        .h-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00E5FF;
            cursor: pointer;
        }

        /* 🎛 Custom Rotary Knob Styling (Size Up & Neon Orange) */
        .knob-container {
            width: 85%; max-width: 65px; aspect-ratio: 1; /* 1x1 꽉 차게 확장 */
            border-radius: 50%; border: 2px solid #FF5500;
            position: relative; cursor: ns-resize;
            display: flex; align-items: center; justify-content: center;
            background-color: #1a1a1a; margin: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.7), 0 2px 5px rgba(0,0,0,0.5);
            touch-action: none; /* 모바일 스크롤 방지 */
        }
        .knob-pointer {
            position: absolute; bottom: 50%; left: 50%;
            width: 3px; height: 50%;
            background-color: transparent;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-135deg);
            pointer-events: none;
        }
        .knob-pointer::after {
            content: ''; position: absolute;
            top: 4px; left: 0; width: 100%; height: 40%; /* 지시선 길이 */
            background-color: #FF5500; border-radius: 2px;
        }
        .knob-val {
            font-size: 11px; font-weight: bold; color: #e0e0e0; pointer-events: none;
        }

        /* 🎹 Piano Keyboard Styling (Flat & Full Fill) */
        .piano-key-w {
            background-color: #d4d4d8; border-right: 1px solid #1a1a1a;
            cursor: pointer; transition: background-color 0.1s;
        }
        .piano-key-w:last-child { border-right: none; }
        .piano-key-b {
            background-color: #27272a; cursor: pointer;
            z-index: 10; transition: background-color 0.1s;
        }
        .piano-key-active { background-color: #FF5500 !important; border-color: #FF5500 !important; }
    </style>

</head>
<body>

    <!-- Main Fixed Width Container -->
    <div id="app-container">

        <div id="main-stage">
  
            <!-- Top Section: Waveform & Global Settings -->
            <!-- 부모 컨테이너에서 강제 비율(aspect) 설정을 완전히 제거합니다 -->
            <div class="grid grid-cols-4 w-full gap-2 mb-2">
                
                <!-- Left: Waveform (3컬럼 차지 = 3/4) -->
                <!-- h-full이 설정되어 있으므로 옆의 정사각형 요소 높이에 맞춰 자동으로 꽉 차게 늘어납니다 -->
                <div class="col-span-3 h-full bg-matte-pad sq-element relative waveform-frame overflow-hidden">
                    <div class="absolute inset-[6px] bg-matte-bg rounded-[10px] p-[6px] box-border overflow-hidden">
                        <canvas id="waveform-canvas" class="w-full h-full block"></canvas>
                        <div id="trim-controls" class="absolute inset-0 hidden-view pointer-events-none">
                            <div id="trim-start-handle" class="absolute left-0 top-[6px] bottom-[6px] w-1.5 bg-[rgba(0,229,255,0.6)] pointer-events-auto cursor-ew-resize rounded-l-sm rounded-r-none"></div>
                            <div id="trim-end-handle" class="absolute right-0 top-[6px] bottom-[6px] w-1.5 bg-[rgba(0,229,255,0.6)] pointer-events-auto cursor-ew-resize rounded-r-sm rounded-l-none"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Right: Buttons (1컬럼 차지 = 1/4) -->
                <div class="col-span-1 aspect-square relative">
                    <!-- Main View Buttons -->
                    <div id="top-right-main" class="absolute inset-0 flex flex-col gap-2">
                        <div class="flex-1 bg-matte-pad sq-element flex items-center justify-center px-1 p-0 m-0">
                            <div class="flex items-baseline justify-center">
                                <input type="number" id="bpm-input" value="120" class="bg-transparent text-center text-matte-text font-bold outline-none text-lg p-0 m-0 leading-none block" style="width: 3ch;" />
<span class="text-xxs text-matte-dim font-bold uppercase leading-none block ml-1">BPM</span>
                            </div>
                        </div>
                        <button id="btn-metronome" class="flex-1 bg-matte-pad sq-element flex items-center justify-center gap-1.5 p-0 m-0 active:bg-matte-dim transition-colors">
                            <div class="metro-dot w-2 h-2 rounded-full bg-[#e0e0e0] transition-colors duration-75"></div>
                            <div class="metro-dot w-2 h-2 rounded-full bg-[#e0e0e0] transition-colors duration-75"></div>
                            <div class="metro-dot w-2 h-2 rounded-full bg-[#e0e0e0] transition-colors duration-75"></div>
                            <div class="metro-dot w-2 h-2 rounded-full bg-[#e0e0e0] transition-colors duration-75"></div>
                        </button>
                    </div>
                    <!-- Edit View Buttons -->
                    <div id="top-right-edit" class="absolute inset-0 flex flex-col gap-2 hidden-view">
                        <button id="btn-mic-rec" class="flex-1 bg-matte-pad sq-element text-neon-orange text-2xl flex items-center justify-center active:bg-neon-orange active:text-white transition-colors">●</button>
                        <button id="btn-import" class="flex-1 bg-matte-pad sq-element text-matte-text font-bold uppercase tracking-wider active:bg-neon-orange active:text-matte-bg transition-colors">IMPORT</button>
                        <input type="file" id="file-import" accept=".wav,.wave,.mp3,.m4a,.ogg,.aac,.flac" class="hidden" />
                    </div>

                    <!-- Synth Mode (Play & Edit): Wave Selector 1x1 -->
                    <div id="top-right-synth" class="absolute inset-0 hidden-view">
                        <button id="btn-wave-select" class="w-full h-full bg-matte-pad sq-element relative flex items-center justify-center active:bg-matte-dim transition-colors">
                            <svg id="wave-icon" class="w-7 h-7 stroke-neon-blue fill-none absolute top-1/3 -translate-y-1/2" stroke-width="2" viewBox="0 0 24 24"><path d="M2 12 Q 7 2 12 12 T 22 12"></path></svg>
                            <span id="wave-name-display" class="text-xs text-matte-text font-bold tracking-widest leading-none absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">SIN</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Middle Section: Square Grid Container + Edit & Nav Row -->
            <!-- 패드 1칸( (100% - 갭3개) / 4 )의 절반 높이를 마진으로 부여합니다 -->
            <div class="w-full flex flex-col gap-2" style="margin-bottom: calc((100% - 1.5rem) / 8);">
                <!-- perfectly square aspect ratio container -->
                <div class="relative w-full aspect-square">
                    
                    <!-- Main Pads Grid -->
                    <div id="pad-grid" class="absolute inset-0 grid grid-cols-4 grid-rows-4 gap-2 w-full h-full">
                        <!-- Pads generated by JS -->
                    </div>

                    <!-- Edit View Grid -->
                    <div id="edit-view-grid" class="absolute inset-0 grid grid-cols-4 grid-rows-4 gap-2 w-full h-full hidden-view">
                        <!-- Row 1 -->
                        <button id="btn-reverse" class="col-span-1 row-span-1 bg-matte-pad sq-element text-xl font-bold text-matte-text flex items-center justify-center active:bg-matte-dim">◀</button>
                        <button id="btn-loop" class="col-span-1 row-span-1 bg-matte-pad sq-element text-2xl font-bold text-matte-text flex items-center justify-center active:bg-matte-dim">↺</button>
                        <div id="pitch-display" class="col-span-2 row-span-1 bg-matte-pad sq-element flex items-center justify-center text-neon-orange text-xl font-bold">0 st</div>
                        
                        <!-- Row 2 -->
                        <button id="btn-edit-play" class="col-span-2 row-span-1 bg-matte-pad sq-element flex items-center justify-center active:bg-matte-dim transition-colors">
                            <svg class="w-12 h-12 fill-neon-green" viewBox="0 0 24 24">
                                <path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z"/>
                            </svg>
                        </button>
                        <button id="btn-pitch-down" class="col-span-1 row-span-1 bg-matte-pad sq-element text-3xl font-bold text-matte-text flex items-center justify-center active:bg-matte-dim">-</button>
                        <button id="btn-pitch-up" class="col-span-1 row-span-1 bg-matte-pad sq-element text-3xl font-bold text-matte-text flex items-center justify-center active:bg-matte-dim">+</button>
                        
                        <!-- Rows 3 & 4 (EQ & Vol) -->
                        <div class="col-span-4 row-span-2 grid grid-cols-4 gap-2 h-full">
                            <div class="bg-matte-pad sq-element flex flex-col items-center py-2 h-full">
                                <span class="text-xxs text-matte-dim font-bold mb-1">LOW</span>
                                <input type="range" id="eq-low" class="v-slider flex-1" min="-12" max="12" value="0">
                            </div>
                            <div class="bg-matte-pad sq-element flex flex-col items-center py-2 h-full">
                                <span class="text-xxs text-matte-dim font-bold mb-1">MID</span>
                                <input type="range" id="eq-mid" class="v-slider flex-1" min="-12" max="12" value="0">
                            </div>
                            <div class="bg-matte-pad sq-element flex flex-col items-center py-2 h-full">
                                <span class="text-xxs text-matte-dim font-bold mb-1">HIGH</span>
                                <input type="range" id="eq-high" class="v-slider flex-1" min="-12" max="12" value="0">
                            </div>
                            <div class="bg-matte-pad sq-element flex flex-col items-center py-2 h-full">
                                <span class="text-xxs text-neon-orange font-bold mb-1">VOL</span>
                                <input type="range" id="vol-slider" class="v-slider flex-1" min="0" max="2" step="0.05" value="1">
                            </div>
                        </div>
                    </div>

                    <!-- 3. Synth Chord Play Grid (패드 추가) -->
                    <div id="chord-view-grid" class="absolute inset-0 grid grid-cols-4 grid-rows-4 gap-2 w-full h-full hidden-view">
                        <!-- Row 1 -->
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="0">C</button>
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="7">G</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="maj">MAJ</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="min">MIN</button>
                        <!-- Row 2 -->
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="2">D</button>
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="9">A</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="dom7">DOM 7</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="min7">MIN 7</button>
                        <!-- Row 3 -->
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="4">E</button>
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="11">B</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="dim">DIM</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="aug">AUG</button>
                        <!-- Row 4 -->
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="5">F</button>
                        <button class="chord-root bg-matte-pad sq-element text-neon-green text-2xl font-bold flex items-center justify-center" data-root="12">C(+1)</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="sus2">SUS 2</button>
                        <button class="chord-type bg-matte-pad sq-element text-matte-dim text-sm font-bold flex items-center justify-center" data-type="sus4">SUS 4</button>
                    </div>

                    <!-- 4. Synth Edit Grid (Strict 4x4 Grid mapping) -->
                    <div id="synth-edit-grid" class="absolute inset-0 grid grid-cols-4 grid-rows-4 gap-2 w-full h-full hidden-view">
                        
                        <!-- [1행 1열] Unison Knob -->
                        <div class="col-span-1 bg-matte-pad sq-element flex flex-col items-center justify-center">
                            <span class="text-[9px] text-matte-dim font-bold mb-1">UNISON</span>
                            <div id="knob-unison" class="knob-container"><div class="knob-pointer"></div><span class="knob-val">1</span></div>
                        </div>
                        
                        <!-- [1행 2~4열] AHDSR Visual Canvas -->
                        <div class="col-span-3 bg-matte-pad sq-element relative p-2 flex flex-col justify-end">
                            <span class="text-[9px] text-neon-blue font-bold tracking-widest absolute top-2 left-0 right-0 text-center pointer-events-none">AHDSR ENVELOPE</span>
                            <canvas id="ahdsr-canvas" class="w-full h-[72%] touch-none cursor-crosshair"></canvas>
                        </div>

                        <!-- [2행 1열] Detune Knob -->
                        <div class="col-span-1 bg-matte-pad sq-element flex flex-col items-center justify-center">
                            <span class="text-[9px] text-matte-dim font-bold mb-1">DETUNE</span>
                            <div id="knob-detune" class="knob-container"><div class="knob-pointer"></div><span class="knob-val">0</span></div>
                        </div>
                        
                        <!-- [2행 2~4열] KEY (Piano) & OCTAVE (여백 제거 및 플랫 디자인 적용) -->
                        <div class="col-span-3 bg-matte-pad sq-element flex overflow-hidden">
                            <div class="flex-1 relative flex piano-container bg-[#1a1a1a]">
                                <!-- White Keys -->
                                <div class="flex-1 piano-key-w" data-key="0"></div>
                                <div class="flex-1 piano-key-w" data-key="2"></div>
                                <div class="flex-1 piano-key-w" data-key="4"></div>
                                <div class="flex-1 piano-key-w" data-key="5"></div>
                                <div class="flex-1 piano-key-w" data-key="7"></div>
                                <div class="flex-1 piano-key-w" data-key="9"></div>
                                <div class="flex-1 piano-key-w" data-key="11"></div>
                                <!-- Black Keys -->
                                <div class="absolute piano-key-b" style="left: 10.5%; width: 7.5%; height: 60%;" data-key="1"></div>
                                <div class="absolute piano-key-b" style="left: 24.5%; width: 7.5%; height: 60%;" data-key="3"></div>
                                <div class="absolute piano-key-b" style="left: 53.5%; width: 7.5%; height: 60%;" data-key="6"></div>
                                <div class="absolute piano-key-b" style="left: 67.5%; width: 7.5%; height: 60%;" data-key="8"></div>
                                <div class="absolute piano-key-b" style="left: 81.5%; width: 7.5%; height: 60%;" data-key="10"></div>
                            </div>
                            <!-- Octave Controls -->
                            <div class="w-12 flex flex-col justify-between border-l border-matte-bg">
                                <button id="btn-oct-up" class="flex-1 bg-matte-dim text-white flex items-center justify-center active:bg-neon-orange font-bold leading-none transition-colors">∧</button>
                                <div class="h-1/3 flex items-center justify-center text-[9px] text-center bg-matte-pad font-bold leading-none text-matte-text tracking-tighter" id="oct-display">OCT 4</div>
                                <button id="btn-oct-down" class="flex-1 bg-matte-dim text-white flex items-center justify-center active:bg-neon-orange font-bold leading-none transition-colors">∨</button>
                            </div>
                        </div>

                        <!-- [3행 1~2열] REVERB -->
                        <div class="col-span-2 bg-matte-pad sq-element flex flex-col items-center justify-center relative">
    <span class="text-[9px] text-neon-blue font-bold tracking-widest absolute top-1 left-0 right-0 text-center pointer-events-none">REVERB</span>
    <div class="flex justify-around items-center w-full px-2">
                                <div class="flex flex-col items-center w-full"><span class="text-[8px] text-matte-dim mb-0.5">MIX</span><div id="knob-rev-mix" class="knob-container"><div class="knob-pointer"></div><span class="knob-val">0</span></div></div>
                                <div class="flex flex-col items-center w-full"><span class="text-[8px] text-matte-dim mb-0.5">DEC</span><div id="knob-rev-dec" class="knob-container"><div class="knob-pointer"></div><span class="knob-val">1.5</span></div></div>
                            </div>
                        </div>
                        
                        <!-- [3행 3~4열] DELAY -->
                        <div class="col-span-2 bg-matte-pad sq-element flex flex-col items-center justify-center relative">
    <span class="text-[9px] text-neon-blue font-bold tracking-widest absolute top-1 left-0 right-0 text-center pointer-events-none">DELAY</span>
    <div class="flex justify-around items-center w-full px-2">
                                <div class="flex flex-col items-center w-full"><span class="text-[8px] text-matte-dim mb-0.5">MIX</span><div id="knob-del-mix" class="knob-container"><div class="knob-pointer"></div><span class="knob-val">0</span></div></div>
                                <div class="flex flex-col items-center w-full"><span class="text-[8px] text-matte-dim mb-0.5">F.B</span><div id="knob-del-fb" class="knob-container"><div class="knob-pointer"></div><span class="knob-val">30</span></div></div>
                            </div>
                        </div>

                        <!-- [4행 1~4열] EQ & VOL (높이 최적화 h-full 및 padding 축소) -->
                        <div class="col-span-1 bg-matte-pad sq-element flex flex-col items-center py-1.5 h-full">
                            <span class="text-[9px] text-matte-dim font-bold mb-1">LOW</span>
                            <input type="range" id="synth-eq-low" class="v-slider flex-1 min-h-[30px]" min="-12" max="12" step="0.1" value="0">
                        </div>
                        <div class="col-span-1 bg-matte-pad sq-element flex flex-col items-center py-1.5 h-full">
                            <span class="text-[9px] text-matte-dim font-bold mb-1">MID</span>
                            <input type="range" id="synth-eq-mid" class="v-slider flex-1 min-h-[30px]" min="-12" max="12" step="0.1" value="0">

                        <div class="col-span-1 bg-matte-pad sq-element flex flex-col items-center py-1.5 h-full">
                            <span class="text-[9px] text-matte-dim font-bold mb-1">HIGH</span>
                            <input type="range" id="synth-eq-high" class="v-slider flex-1 min-h-[30px]" min="-12" max="12" step="0.1" value="0">

                <!-- Nav Row: EDIT | < | MODE LABEL | > -->
                <div class="w-full relative">
                    <!-- 하단 REC/PLAY 버튼과 1px의 오차도 없이 동일한 높이를 맞추기 위한 수학적 스페이서 -->
                    <!-- 공식: ((전체너비 - 갭3개) / 8) - (갭 절반) = 정사각형 패드 1개 높이의 정확히 절반 -->

                    <!-- 스페이서가 확보한 높이(inset-0) 위에 4x4 패드와 동일한 4칸짜리 그리드를 덮어씌웁니다 -->

                        <!-- 각 버튼이 패드와 완벽히 일치하는 1칸(col-span-1)씩 차지하게 됩니다 -->

                        <!-- 너비가 1칸으로 줄어들었으므로 텍스트가 넘치지 않도록 폰트 크기(text-[11px])와 자간(tracking-tighter)을 조절했습니다 -->
                        <div id="mode-display" class="col-span-1 h-full bg-matte-pad sq-element flex items-center justify-center text-matte-text font-bold uppercase tracking-wider transition-colors shadow-inner text-center">SAMPLE</div>
                        
                        <button id="btn-mode-next" class="col-span-1 h-full bg-matte-pad sq-element text-matte-text font-bold text-xl active:bg-matte-dim transition-colors">&gt;</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: 2 Rows x 4 Cols Grid -->
        <!-- 전체를 감싸는 컨테이너 자체를 4등분 그리드로 선언 -->
        <div id="bottom-controls" class="w-full relative grid grid-cols-4 gap-2">
            
            <!-- 패드 1개와 정확히 일치하는 높이를 강제하기 위한 투명 1x1 스페이서 -->
            <div class="col-span-1 aspect-square pointer-events-none invisible"></div>
            
            <!-- 확보된 패드 1칸 높이 위에 실제 하단 UI를 4칸x2줄(4x2) 그리드로 덮어씌움 -->
            <div class="absolute inset-0 grid grid-cols-4 grid-rows-2 gap-2">
                <!-- Row 1: 빈 공간 + REC + PLAY -->
                <div class="col-span-2 row-span-1"></div>
                <button id="btn-rec-perf" class="col-span-1 row-span-1 bg-matte-pad sq-element text-neon-orange text-2xl flex items-center justify-center active:bg-neon-orange active:text-white transition-colors">●</button>
                <button id="btn-play-perf" class="col-span-1 row-span-1 bg-matte-pad sq-element text-neon-green flex items-center justify-center active:bg-neon-green active:text-matte-bg transition-colors">
                    <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"> <!-- 절반 높이에 맞춰 아이콘 약간 축소 (w-9 -> w-7) -->
                        <path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z"/>
                    </svg>
                </button>
                
                <!-- Row 2: Logo + EXP -->
                <div id="logo-text" class="col-span-3 row-span-1 flex items-end justify-start pl-1 pb-0 text-matte-text font-bold tracking-tighter lowercase leading-none select-none" style="font-size: 1.55rem;">
                    swiftsketch <!-- 절반 높이에 맞춰 폰트 크기 약간 축소 (1.85rem -> 1.55rem) -->
                </div>
                <button id="btn-export" class="col-span-1 row-span-1 bg-matte-pad sq-element text-matte-dim text-xs font-bold uppercase opacity-50 pointer-events-none transition-opacity flex items-center justify-center">EXP</button>
            </div>
        </div>

    </div>

    <script>
        const DOM = {
            padGrid: document.getElementById('pad-grid'),
            editViewGrid: document.getElementById('edit-view-grid'),
            chordViewGrid: document.getElementById('chord-view-grid'),
            synthEditGrid: document.getElementById('synth-edit-grid'),
            canvas: document.getElementById('waveform-canvas'),
            
            topRightMain: document.getElementById('top-right-main'),
            topRightEdit: document.getElementById('top-right-edit'),
            topRightSynth: document.getElementById('top-right-synth'),
            
            btnEditMode: document.getElementById('btn-edit-mode'),
            btnModePrev: document.getElementById('btn-mode-prev'),
            modeDisplay: document.getElementById('mode-display'),
            btnModeNext: document.getElementById('btn-mode-next'),
            btnWaveSelect: document.getElementById('btn-wave-select'),

            trimControls: document.getElementById('trim-controls'),
            trimStartHandle: document.getElementById('trim-start-handle'),
            trimEndHandle: document.getElementById('trim-end-handle'),
            btnMicRec: document.getElementById('btn-mic-rec'),
            btnImport: document.getElementById('btn-import'),
            fileImport: document.getElementById('file-import'),
            btnReverse: document.getElementById('btn-reverse'),
            btnLoop: document.getElementById('btn-loop'),
            pitchDisplay: document.getElementById('pitch-display'),
            btnPitchDown: document.getElementById('btn-pitch-down'),
            btnPitchUp: document.getElementById('btn-pitch-up'),
            btnEditPlay: document.getElementById('btn-edit-play'),
            eqLow: document.getElementById('eq-low'),
            eqMid: document.getElementById('eq-mid'),
            eqHigh: document.getElementById('eq-high'),
            volSlider: document.getElementById('vol-slider'),
            bpmInput: document.getElementById('bpm-input'),
            btnMetronome: document.getElementById('btn-metronome'),
            btnRecPerf: document.getElementById('btn-rec-perf'),
            btnPlayPerf: document.getElementById('btn-play-perf'),
            btnExport: document.getElementById('btn-export'),
            // [추가] 신스 파라미터 DOM 연결
            synthUnison: document.getElementById('synth-unison'),
            synthDetune: document.getElementById('synth-detune'),
            synthAttack: document.getElementById('synth-attack'),
            synthHold: document.getElementById('synth-hold'),
            synthDecay: document.getElementById('synth-decay'),
            synthSustain: document.getElementById('synth-sustain'),
            synthRelease: document.getElementById('synth-release'),
            synthEqLow: document.getElementById('synth-eq-low'),
            synthEqMid: document.getElementById('synth-eq-mid'),
            synthEqHigh: document.getElementById('synth-eq-high'),
            synthVol: document.getElementById('synth-vol')
        };

        const NUM_PADS = 16;
        let audioCtx, masterGain, recordGain, destNode, mediaRecorder;
        let recordedChunks = [];
        let performanceBlob = null, performanceWavBlob = null, performanceAudioUrl = null, performanceAudio = null;

        let currentMode = 'sample'; // 'sample' 또는 'chord'
        let isEditMode = false;
        let isEditSelectionMode = false;
        let currentEditPadId = 0;
        let isRecordingPerf = false, isMetronomeOn = false, metronomeInterval = null, metroBeat = 0;
        
        let canvasCtx = DOM.canvas.getContext('2d');
        
        const padsData = Array.from({length: NUM_PADS}, (_, i) => ({
            id: i, buffer: null, originalBuffer: null, reverse: false, loop: false, pitchSt: 0,
            eq: { low: 0, mid: 0, high: 0 }, volume: 1.0, trimStart: 0.0, trimEnd: 1.0
        }));

        let activeSources = {}; let padIsPlaying = {};

        // === [추가] 신스 상태 및 동시 터치 관리 변수 ===
        const waveTypes = ['sine', 'square', 'sawtooth', 'triangle'];
        let currentWaveIndex = 0;
        let activeSynthNodes = [];

        // 🎛 신스 파라미터 상태 객체 및 이벤트 리스너
        const synthState = {
            unison: 1, detune: 0,
            key: 0, octave: 4, // 0=C, 1=Db...
            reverb: { mix: 0, decay: 1.5 },
            delay: { mix: 0, fb: 0.3 },
            env: { a: 0.1, h: 0.2, d: 0.5, s: 0.7, r: 1.0 },
            eq: { low: 0, mid: 0, high: 0 },
            vol: 1.0
        };

        // UI 조작 시 즉시 상태 업데이트 (기존 세로 슬라이더들)
        DOM.synthEqLow.addEventListener('input', e => synthState.eq.low = parseFloat(e.target.value));
        DOM.synthEqMid.addEventListener('input', e => synthState.eq.mid = parseFloat(e.target.value));
        DOM.synthEqHigh.addEventListener('input', e => synthState.eq.high = parseFloat(e.target.value));
        DOM.synthVol.addEventListener('input', e => synthState.vol = parseFloat(e.target.value));

        // 🎛 마우스/터치 드래그용 커스텀 노브 헬퍼 함수
        function setupKnob(id, stateObj, key, min, max, step, formatFn, onUpdate) {
            const el = document.getElementById(id);
            if(!el) return;
            const pointer = el.querySelector('.knob-pointer');
            const valText = el.querySelector('.knob-val');
            let isDragging = false; let startY = 0; let startVal = 0;
            
            function render(v) {
                const pct = (v - min) / (max - min);
                const deg = -135 + (pct * 270);
                pointer.style.transform = `translateX(-50%) rotate(${deg}deg)`;
                valText.innerText = formatFn ? formatFn(v) : v;
            }
            
            function setVal(newVal) {
                newVal = Math.max(min, Math.min(max, newVal));
                newVal = Math.round(newVal / step) * step;
                newVal = parseFloat(newVal.toFixed(3));
                stateObj[key] = newVal;
                render(newVal);
                if(onUpdate) onUpdate(newVal);
            }
            
            const onDown = e => { isDragging = true; startY = e.clientY || (e.touches ? e.touches[0].clientY : 0); startVal = stateObj[key]; e.preventDefault(); };
            const onMove = e => {
                if(!isDragging) return;
                const clientY = e.clientY || (e.touches ? e.touches[0].clientY : null);
                if(clientY === null) return;
                setVal(startVal + ((startY - clientY) * (max - min) / 150)); 
            };
            const onUp = () => isDragging = false;
            
            el.addEventListener('mousedown', onDown); el.addEventListener('touchstart', onDown, {passive: false});
            window.addEventListener('mousemove', onMove); window.addEventListener('touchmove', onMove, {passive: false});
            window.addEventListener('mouseup', onUp); window.addEventListener('touchend', onUp);
            render(stateObj[key]); 
        }

        // 🎹 키(Key) 이름 및 패드 라벨 연동 로직
        const keyNames = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        function updateChordPads() {
            document.querySelectorAll('.chord-root').forEach(btn => {
                const interval = parseInt(btn.dataset.root); 
                const actualPitch = synthState.key + interval;
                let name = keyNames[actualPitch % 12];
                if (actualPitch >= 12 && interval > 0) name += '(+1)'; 
                btn.innerText = name;
            });
        }

        // 🎹 피아노 건반(Key) & 옥타브 제어 로직
        const pianoKeys = document.querySelectorAll('.piano-key-w, .piano-key-b');
        const btnOctUp = document.getElementById('btn-oct-up');
        const btnOctDown = document.getElementById('btn-oct-down');
        const octDisplay = document.getElementById('oct-display');

        function updatePianoUI() {
            pianoKeys.forEach(key => {
                const k = parseInt(key.dataset.key);
                key.classList.toggle('piano-key-active', k === synthState.key);
            });
            octDisplay.innerText = `OCT ${synthState.octave}`;
        }

        pianoKeys.forEach(key => {
            const handleKey = (e) => { e.preventDefault(); synthState.key = parseInt(key.dataset.key); updatePianoUI(); updateChordPads(); };
            key.addEventListener('mousedown', handleKey); key.addEventListener('touchstart', handleKey, {passive: false});
        });

        const handleOctUp = (e) => { e.preventDefault(); synthState.octave = Math.min(6, synthState.octave + 1); updatePianoUI(); updateChordPads(); };
        const handleOctDown = (e) => { e.preventDefault(); synthState.octave = Math.max(2, synthState.octave - 1); updatePianoUI(); updateChordPads(); };
        btnOctUp.addEventListener('mousedown', handleOctUp); btnOctUp.addEventListener('touchstart', handleOctUp);
        btnOctDown.addEventListener('mousedown', handleOctDown); btnOctDown.addEventListener('touchstart', handleOctDown);
        
        // 시작할 때 UI 및 라벨 동기화
        updatePianoUI(); 
        updateChordPads(); 

        // 📈 AHDSR 시각화 캔버스 및 터치(드래그) 조작 로직
        const ahdsrCanvas = document.getElementById('ahdsr-canvas');
        const aCtx = ahdsrCanvas.getContext('2d');
        let activeAhdsrNode = -1;

        function drawAHDSR() {
            const rect = ahdsrCanvas.getBoundingClientRect();
            if (rect.width === 0) return; 

            const dpr = window.devicePixelRatio || 1;
            if (ahdsrCanvas.width !== rect.width * dpr || ahdsrCanvas.height !== rect.height * dpr) { 
                ahdsrCanvas.width = rect.width * dpr;
                ahdsrCanvas.height = rect.height * dpr;
            }
            
            const w = ahdsrCanvas.width; const h = ahdsrCanvas.height;
            aCtx.clearRect(0, 0, w, h);

            const { a, h: hold, d, s, r } = synthState.env;
            const padX = 14 * dpr; // 해상도 대응 여백
            const scaleX = ((w - padX * 2) * 0.9) / 9.0; 
            const susW = (w - padX * 2) * 0.1;
            const padY = 12 * dpr; 

            const x0 = padX, y0 = h - padY;
            const x1 = x0 + a * scaleX, y1 = padY;
            const x2 = x1 + hold * scaleX, y2 = padY;
            const x3 = x2 + d * scaleX, y3 = (h - padY) - (s * (h - padY * 2));
            const x4 = x3 + susW, y4 = y3;
            const x5 = x4 + r * scaleX, y5 = h - padY;

            aCtx.beginPath(); aCtx.strokeStyle = '#e0e0e0'; aCtx.lineWidth = 2 * dpr;
            aCtx.moveTo(x0, y0); aCtx.lineTo(x1, y1); aCtx.lineTo(x2, y2);
            aCtx.lineTo(x3, y3); aCtx.lineTo(x4, y4); aCtx.lineTo(x5, y5);
            aCtx.stroke();

            aCtx.lineTo(x5, h); aCtx.lineTo(x0, h);
            aCtx.fillStyle = 'rgba(224, 224, 224, 0.1)'; aCtx.fill();

            aCtx.beginPath();
            aCtx.arc(x0, y0, 6 * dpr, 0, Math.PI * 2);
            aCtx.fillStyle = '#e0e0e0';
            aCtx.fill();

            const nodes = [ {x: x0, y: y0}, {x: x1, y: y1}, {x: x2, y: y2}, {x: x3, y: y3}, {x: x5, y: y5} ];
            nodes.forEach((node, idx) => {
                aCtx.beginPath(); aCtx.arc(node.x, node.y, 6 * dpr, 0, Math.PI * 2);
                aCtx.fillStyle = (activeAhdsrNode === idx) ? '#FF5500' : '#e0e0e0';
                aCtx.fill();
            });
        }

        function handleAhdsrDrag(e) {
            if (activeAhdsrNode === -1) return;
            const rect = ahdsrCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const touchX = (clientX - rect.left) * (ahdsrCanvas.width / rect.width);
            const touchY = (clientY - rect.top) * (ahdsrCanvas.height / rect.height);
            
            const w = ahdsrCanvas.width; const h = ahdsrCanvas.height;
            const padX = 14 * (window.devicePixelRatio || 1);
            const scaleX = ((w - padX * 2) * 0.9) / 9.0; const susW = (w - padX * 2) * 0.1; const padY = 12 * (window.devicePixelRatio || 1);
            
            if (activeAhdsrNode === 0) {
                synthState.env.a = Math.max(0.01, Math.min(2, (touchX - padX) / scaleX));
            } else if (activeAhdsrNode === 1) { 
                const x1 = padX + synthState.env.a * scaleX;
                synthState.env.h = Math.max(0, Math.min(2, (touchX - x1) / scaleX));
            } else if (activeAhdsrNode === 2) { 
                const x2 = padX + (synthState.env.a + synthState.env.h) * scaleX;
                synthState.env.d = Math.max(0.01, Math.min(2, (touchX - x2) / scaleX));
                const sVal = 1.0 - ((touchY - padY) / (h - padY * 2));
                synthState.env.s = Math.max(0, Math.min(1, sVal));
            } else if (activeAhdsrNode === 3) { 
                const x4 = padX + (synthState.env.a + synthState.env.h + synthState.env.d) * scaleX + susW;
                synthState.env.r = Math.max(0.01, Math.min(3, (touchX - x4) / scaleX));
            }
            drawAHDSR();
        }

        function startAhdsrDrag(e) {
            const rect = ahdsrCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const touchX = (clientX - rect.left) * (ahdsrCanvas.width / rect.width);
            
            const w = ahdsrCanvas.width; 
            const padX = 14 * (window.devicePixelRatio || 1);
            const scaleX = ((w - padX * 2) * 0.9) / 9.0; const susW = (w - padX * 2) * 0.1;
            const { a, h: hold, d } = synthState.env;
            const nx = [ 
                padX + a * scaleX, 
                padX + (a+hold)*scaleX, 
                padX + (a+hold+d)*scaleX, 
                padX + (a+hold+d)*scaleX + susW + synthState.env.r*scaleX 
            ];
            
            let minDist = 999;
            nx.forEach((x, idx) => {
                const dist = Math.abs(x - touchX);
                if (dist < 50 && dist < minDist) { minDist = dist; activeAhdsrNode = idx; }
            });
            drawAHDSR(); e.preventDefault();
        }
        
        const stopAhdsrDrag = () => { activeAhdsrNode = -1; drawAHDSR(); };

        ahdsrCanvas.addEventListener('mousedown', startAhdsrDrag); ahdsrCanvas.addEventListener('touchstart', startAhdsrDrag, {passive: false});
        window.addEventListener('mousemove', handleAhdsrDrag); window.addEventListener('touchmove', handleAhdsrDrag, {passive: false});
        window.addEventListener('mouseup', stopAhdsrDrag); window.addEventListener('touchend', stopAhdsrDrag);
        
        setTimeout(drawAHDSR, 100);
        window.addEventListener('resize', drawAHDSR);

        // 🎛 노브 이벤트 등록 (Key, Octave는 피아노로 대체되었으므로 4개만 남음)
        setupKnob('knob-unison', synthState, 'unison', 1, 7, 1);
        setupKnob('knob-detune', synthState, 'detune', 0, 50, 1);
        setupKnob('knob-rev-mix', synthState.reverb, 'mix', 0, 1, 0.01, v => Math.round(v*100));
        setupKnob('knob-rev-dec', synthState.reverb, 'decay', 0.1, 5, 0.1, v => v.toFixed(1), updateReverbBuffer);
        setupKnob('knob-del-mix', synthState.delay, 'mix', 0, 1, 0.01, v => Math.round(v*100));
        setupKnob('knob-del-fb', synthState.delay, 'fb', 0, 0.9, 0.01, v => Math.round(v*100));

        // ==========================================
        let currentPressedRootBtn = null;
        let currentPressedTypeBtn = null;
        let currentPressedRoot = null;
        let currentPressedType = null;

        // === 화면 전환 통합 관리 함수 ===

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // [추가] 마스터 출력 클리핑을 방지하는 리미터(Compressor) 생성
            const masterLimiter = audioCtx.createDynamicsCompressor();
            masterLimiter.threshold.value = -1.0; // -1dB 이상 올라가면 압축 시작 (클리핑 방지)
            masterLimiter.knee.value = 0.0;       // 하드 니 (한계점 도달 시 즉각 개입)
            masterLimiter.ratio.value = 20.0;     // 20:1의 강력한 압축 비율 (리미터 역할)
            masterLimiter.attack.value = 0.005;   // 0.005초의 빠른 어택으로 피크 차단
            masterLimiter.release.value = 0.05;   // 빠른 릴리즈로 답답함 방지

            masterGain = audioCtx.createGain();
            masterGain.connect(masterLimiter);             // 마스터 게인 -> 리미터로 연결
            masterLimiter.connect(audioCtx.destination);   // 리미터 -> 스피커 출력

            // [추가] 녹음용 출력에도 동일한 리미터 적용 (WAV 파일 수출 시 깨짐 방지)
            const recordLimiter = audioCtx.createDynamicsCompressor();
            recordLimiter.threshold.value = -1.0;
            recordLimiter.knee.value = 0.0;
            recordLimiter.ratio.value = 20.0;
            recordLimiter.attack.value = 0.005;
            recordLimiter.release.value = 0.05;

            recordGain = audioCtx.createGain();
            recordGain.gain.value = 1.0;
            recordGain.connect(recordLimiter);             // 녹음 게인 -> 녹음용 리미터로 연결

            destNode = audioCtx.createMediaStreamDestination();
            recordLimiter.connect(destNode);               // 리미터 -> 녹음기 출력
            
            generateDefaultSounds().then(() => {
                if (isEditSelectionMode) {
                    Array.from(DOM.padGrid.children).forEach((pad, idx) => {
                        const hasSample = !!padsData[idx].buffer;
                        pad.classList.toggle('edit-select-mode', hasSample);
                        pad.classList.toggle('edit-select-dim', !hasSample);
                    });
                }
            });
            drawWaveform(null);
        }

        async function generateDefaultSounds() {
            const sampleRate = audioCtx.sampleRate;
            const makeBuffer = async (renderFunc, duration) => {
                const offCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, sampleRate * duration, sampleRate);
                renderFunc(offCtx);
                return await offCtx.startRendering();
            };

            // Basic Drums (Kick, Snare, HiHats) on bottom row
            padsData[12].buffer = padsData[12].originalBuffer = await makeBuffer(ctx => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(0); osc.stop(0.5);
            }, 0.5);

            padsData[13].buffer = padsData[13].originalBuffer = await makeBuffer(ctx => {
                const osc = ctx.createOscillator();
                const noise = ctx.createBufferSource();
                const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                for (let i=0; i<noiseBuf.length; i++) noiseBuf.getChannelData(0)[i] = Math.random() * 2 - 1;
                noise.buffer = noiseBuf;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 1000;
                const og = ctx.createGain(), ng = ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(250, ctx.currentTime);
                og.gain.setValueAtTime(1, ctx.currentTime); og.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                ng.gain.setValueAtTime(1, ctx.currentTime); ng.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.connect(og); noise.connect(filter); filter.connect(ng);
                og.connect(ctx.destination); ng.connect(ctx.destination);
                osc.start(); noise.start();
            }, 0.2);

            padsData[14].buffer = padsData[14].originalBuffer = await makeBuffer(ctx => {
                const noise = ctx.createBufferSource();
                const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
                for (let i=0; i<noiseBuf.length; i++) noiseBuf.getChannelData(0)[i] = Math.random() * 2 - 1;
                noise.buffer = noiseBuf;
                const filter = ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 5000;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination); noise.start();
            }, 0.1);

            padsData[15].buffer = padsData[15].originalBuffer = await makeBuffer(ctx => {
                 const noise = ctx.createBufferSource();
                const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
                for (let i=0; i<noiseBuf.length; i++) noiseBuf.getChannelData(0)[i] = Math.random() * 2 - 1;
                noise.buffer = noiseBuf;
                const filter = ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 5000;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination); noise.start();
            }, 0.4);

            // Simple Synths for other pads
            const freqs = [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 622.25];
            for(let i=0; i<8; i++) { // 현재는 1~2행 샘플만 생성
            // for(let i=0; i<12; i++) { // 기존 코드: 3행까지 생성
                padsData[i].buffer = padsData[i].originalBuffer = await makeBuffer(ctx => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth'; osc.frequency.value = freqs[i];
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.setValueAtTime(2000, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.5);
                    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(0); osc.stop(0.5);
                }, 0.5);
            }
        }

        function createPadElements() {
            DOM.padGrid.innerHTML = '';
            for (let i = 0; i < NUM_PADS; i++) {
                const pad = document.createElement('div');
                pad.className = 'bg-matte-pad sq-element touch-none cursor-pointer flex items-end p-1 transition-colors duration-75';
                pad.dataset.id = i;
                
                pad.addEventListener('touchstart', (e) => { e.preventDefault(); handlePadDown(i, pad); });
                pad.addEventListener('mousedown', (e) => { e.preventDefault(); handlePadDown(i, pad); });
                pad.addEventListener('touchend', (e) => { e.preventDefault(); handlePadUp(i, pad); });
                pad.addEventListener('mouseup', (e) => { e.preventDefault(); handlePadUp(i, pad); });
                pad.addEventListener('mouseleave', (e) => { e.preventDefault(); handlePadUp(i, pad); });

                DOM.padGrid.appendChild(pad);
                padIsPlaying[i] = false;
            }
        }

        function playPad(id) {
            initAudio();
            const pData = padsData[id];
            if (!pData.buffer) return;

            // 💡 팝 노이즈 방지: 이전 샘플이 재생 중이면 0.015초간 아주 빠르게 페이드아웃 후 정지
            if (activeSources[id]) {
                const prev = activeSources[id];
                const now = audioCtx.currentTime;
                try {
                    prev.gainNode.gain.cancelScheduledValues(now);
                    prev.gainNode.gain.setValueAtTime(prev.gainNode.gain.value, now);
                    prev.gainNode.gain.linearRampToValueAtTime(0, now + 0.015);
                    setTimeout(() => { try { prev.source.stop(); } catch(e){} }, 20);
                } catch(e) { try { prev.source.stop(); } catch(e){} }
            }

            const source = audioCtx.createBufferSource();
            source.buffer = pData.buffer;
            source.playbackRate.value = Math.pow(2, pData.pitchSt / 12);
            source.loop = pData.loop;

            const lowEQ = audioCtx.createBiquadFilter(); lowEQ.type = 'lowshelf'; lowEQ.frequency.value = 320; lowEQ.gain.value = pData.eq.low;
            const midEQ = audioCtx.createBiquadFilter(); midEQ.type = 'peaking'; midEQ.frequency.value = 1000; midEQ.Q.value = 0.5; midEQ.gain.value = pData.eq.mid;
            const highEQ = audioCtx.createBiquadFilter(); highEQ.type = 'highshelf'; highEQ.frequency.value = 3200; highEQ.gain.value = pData.eq.high;
            const gainNode = audioCtx.createGain(); gainNode.gain.value = pData.volume;

            source.connect(lowEQ); lowEQ.connect(midEQ); midEQ.connect(highEQ); highEQ.connect(gainNode);
            gainNode.connect(masterGain);
            gainNode.connect(recordGain);

            const dur = pData.buffer.duration;
            const startOffset = pData.trimStart * dur;
            let playDuration = (pData.trimEnd - pData.trimStart) * dur;
            if (playDuration < 0.01) playDuration = 0.01;

            if (pData.loop) {
                source.loopStart = startOffset;
                source.loopEnd = startOffset + playDuration;
                gainNode.gain.setValueAtTime(pData.volume, audioCtx.currentTime);
                source.start(0, startOffset);
            } else {
                const now = audioCtx.currentTime;
                const fadeTime = Math.min(0.002, playDuration / 2);

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(pData.volume, now + fadeTime);
                gainNode.gain.setValueAtTime(pData.volume, now + playDuration - fadeTime);
                gainNode.gain.linearRampToValueAtTime(0, now + playDuration);

                source.start(0, startOffset, playDuration);
            }

            // 수정: source만 저장하던 것을 gainNode와 함께 객체로 저장
            activeSources[id] = { source: source, gainNode: gainNode };

            // Update UI
            drawWaveform(pData.buffer, pData.trimStart, pData.trimEnd);
            if(isEditMode) {
                currentEditPadId = id;
                updateEditUI();
            }
        }

        function stopPad(id) {
            if (activeSources[id]) {
                try { activeSources[id].stop(); } catch(e){}
                activeSources[id] = null;
            }
        }

        function handlePadDown(id, el) {
            if (isEditSelectionMode) {
                isEditSelectionMode = false; isEditMode = true; currentEditPadId = id;
                updateUIState();
                return;
            }
            
            const pData = padsData[id];
            
            if (pData.loop) {
                // Toggle behavior for looped pads
                if (padIsPlaying[id]) {
                    stopPad(id);
                    el.classList.remove('active-pad');
                    padIsPlaying[id] = false;
                } else {
                    playPad(id);
                    el.classList.add('active-pad');
                    padIsPlaying[id] = true;
                }
            } else {
                // Normal trigger behavior
                playPad(id);
                el.classList.add('active-pad');
                padIsPlaying[id] = true;
            }
        }

        function handlePadUp(id, el) {
            if (isEditSelectionMode) return;
            const pData = padsData[id];
                    
            if (!pData.loop) {
                // 즉시 클래스를 제거하되 CSS transition에 의해 서서히 불빛이 꺼짐
                el.classList.remove('active-pad');
                padIsPlaying[id] = false;
            }
        }

        let isResizing = false;
        function drawWaveform(buffer, trimStart = 0, trimEnd = 1) {
            if (!isResizing) resizeCanvasInternal();
            
            const dpr = window.devicePixelRatio || 1;
            const width = DOM.canvas.width / dpr;
            const height = DOM.canvas.height / dpr;
            
            canvasCtx.fillStyle = '#1a1a1a'; // 앱 배경색과 동일하게 처리
            canvasCtx.fillRect(0, 0, width, height);
            
            if (!buffer) return;

            const data = buffer.getChannelData(0);
            // Protect against trailing line by ensuring we only iterate valid data
            const lineWidth = 1.5;
            const strokePaddingY = lineWidth; // 선 두께 고려 상하 안전 여백

            const plotWidth = width;
            const step = Math.ceil(data.length / plotWidth);
            const centerY = height / 2;

            // 전체 샘플 내 피크값 검색 (1.0을 넘어서는 스네어/노이즈 샘플 대응)
            let maxPeak = 0;
            for (let i = 0; i < data.length; i++) {
                const absVal = Math.abs(data[i]);
                if (absVal > maxPeak) maxPeak = absVal;
            }
            // 기본 스케일 한계는 1.0으로 두되, 피크가 1.0을 초과하면 해당 피크 기준으로 전체 파형을 축소
            const scalePeak = Math.max(1.0, maxPeak);
            const amp = ((height - strokePaddingY * 2) / 2) / scalePeak;

            if (trimStart > 0 || trimEnd < 1) {
                canvasCtx.fillStyle = 'rgba(0, 229, 255, 0.12)'; // 재생 선택 구간 은은한 네온 블루 하이라이트
                canvasCtx.fillRect(trimStart * width, 0, (trimEnd - trimStart) * width, height);
            }

            canvasCtx.beginPath();
            canvasCtx.strokeStyle = '#00E5FF'; // 선명한 네온 블루 (#00E5FF)
            canvasCtx.lineWidth = lineWidth;

            for (let i = 0; i < plotWidth; i++) {
                let min = 1.0;
                let max = -1.0;
                let hasData = false;
                
                for (let j = 0; j < step; j++) {
                    const dataIndex = (i * step) + j;
                    if (dataIndex < data.length) {
                        hasData = true;
                        const datum = data[dataIndex];
                        if (datum < min) min = datum;
                        if (datum > max) max = datum;
                    }
                }
                
                if (hasData) {
                    const x = i;
                    const y1 = centerY + min * amp;
                    const y2 = centerY + max * amp;

                    if (i === 0) canvasCtx.moveTo(x, y1);
                    canvasCtx.moveTo(x, y1);
                    canvasCtx.lineTo(x, y2);
                }
            }
            canvasCtx.stroke();
            
            if(isEditMode) updateTrimHandlesUI();
        }

        function resizeCanvasInternal() {
            const dpr = window.devicePixelRatio || 1;
            const rect = DOM.canvas.getBoundingClientRect();
            const displayWidth = rect.width;
            const displayHeight = rect.height;
            if (DOM.canvas.width !== displayWidth * dpr || DOM.canvas.height !== displayHeight * dpr) {
                DOM.canvas.width = displayWidth * dpr;
                DOM.canvas.height = displayHeight * dpr;
                canvasCtx.scale(dpr, dpr);
            }
        }

        window.addEventListener('resize', () => {
            isResizing = true;
            resizeCanvasInternal();
            
            if (currentMode === 'chord') {
                drawSynthWaveform();
            } else {
                if(padsData && padsData[currentEditPadId] && isEditMode) {
                    drawWaveform(padsData[currentEditPadId].buffer, padsData[currentEditPadId].trimStart, padsData[currentEditPadId].trimEnd);
                } else {
                    drawWaveform(null); 
                }
            }
            isResizing = false;
        });

        // === 화면 전환 통합 관리 함수 ===

        // 모드 변경 버튼 이벤트 (<, >)
        DOM.btnModePrev.addEventListener('click', toggleMode);
        DOM.btnModeNext.addEventListener('click', toggleMode);
        function toggleMode() {
            currentMode = (currentMode === 'sample') ? 'chord' : 'sample';

            updateUIState();
        }

        DOM.btnEditMode.addEventListener('click', () => {

        function updateEditUI() {
            const pData = padsData[currentEditPadId];
            DOM.btnReverse.classList.toggle('active-btn', pData.reverse);
            DOM.btnLoop.classList.toggle('active-btn', pData.loop);
            DOM.pitchDisplay.innerText = `${pData.pitchSt > 0 ? '+' : ''}${pData.pitchSt} st`;

        DOM.btnReverse.addEventListener('click', () => {
            const pData = padsData[currentEditPadId];
            pData.reverse = !pData.reverse;
            if (pData.originalBuffer) {
                const newBuffer = audioCtx.createBuffer(pData.originalBuffer.numberOfChannels, pData.originalBuffer.length, pData.originalBuffer.sampleRate);
                for (let c = 0; c < pData.originalBuffer.numberOfChannels; c++) {
                    const chData = new Float32Array(pData.originalBuffer.getChannelData(c));
                    if (pData.reverse) chData.reverse();
                    newBuffer.copyToChannel(chData, c);
                }
                pData.buffer = newBuffer;
            }
            updateEditUI();
            drawWaveform(pData.buffer, pData.trimStart, pData.trimEnd);

            if (!padsData[currentEditPadId].loop && padIsPlaying[currentEditPadId]) {
                stopPad(currentEditPadId);
                padIsPlaying[currentEditPadId] = false;
                DOM.padGrid.children[currentEditPadId].classList.remove('active-pad');
            }
            updateEditUI();
        });

        DOM.btnPitchUp.addEventListener('click', () => { padsData[currentEditPadId].pitchSt = Math.min(24, padsData[currentEditPadId].pitchSt + 1); updateEditUI(); });
        DOM.btnPitchDown.addEventListener('click', () => { padsData[currentEditPadId].pitchSt = Math.max(-24, padsData[currentEditPadId].pitchSt - 1); updateEditUI(); });

        DOM.eqLow.addEventListener('input', e => { padsData[currentEditPadId].eq.low = parseFloat(e.target.value); });
        DOM.eqMid.addEventListener('input', e => { padsData[currentEditPadId].eq.mid = parseFloat(e.target.value); });
        DOM.eqHigh.addEventListener('input', e => { padsData[currentEditPadId].eq.high = parseFloat(e.target.value); });
        DOM.volSlider.addEventListener('input', e => { padsData[currentEditPadId].volume = parseFloat(e.target.value); });

        function toggleEditPlay(e) {
            e.preventDefault();
            initAudio();
            const id = currentEditPadId;
            
            // 현재 오디오 소스가 재생 중이면 정지 후 재시작, 정지 상태면 시작 지점부터 재생
            if (activeSources[id]) {
                stopPad(id);
            }
            playPad(id);

            // 눌렀을 때 순간 하이라이트 후 바로 제거 (패드와 동일하게 서서히 꺼짐)

        DOM.btnEditPlay.addEventListener('touchstart', toggleEditPlay);

        let activeHandle = null;
        function updateTrimHandlesUI() {
            const pData = padsData[currentEditPadId];
            DOM.trimStartHandle.style.left = `${pData.trimStart * 100}%`;
            DOM.trimEndHandle.style.right = `${(1 - pData.trimEnd) * 100}%`;
        }

        function handleTrimDrag(e) {
            if (!activeHandle) return;
            const rect = DOM.canvas.parentElement.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let ratio = (clientX - rect.left) / rect.width;
            ratio = Math.max(0, Math.min(1, ratio));

            const pData = padsData[currentEditPadId];
            if (activeHandle === 'start') pData.trimStart = Math.min(ratio, pData.trimEnd - 0.01);
            else pData.trimEnd = Math.max(ratio, pData.trimStart + 0.01);
            
            updateTrimHandlesUI();
            drawWaveform(pData.buffer, pData.trimStart, pData.trimEnd);
        }

        ['mousedown', 'touchstart'].forEach(evt => {

        });
        ['mousemove', 'touchmove'].forEach(evt => window.addEventListener(evt, handleTrimDrag));

        DOM.fileImport.addEventListener('change', async (e) => {

            initAudio();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            padsData[currentEditPadId].originalBuffer = audioBuffer;
            padsData[currentEditPadId].buffer = audioBuffer;
            padsData[currentEditPadId].reverse = false;
            padsData[currentEditPadId].trimStart = 0;
